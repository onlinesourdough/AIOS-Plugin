name: Versioned documentation

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check package and documentation
        run: |
          python3 tests/validate.py
          python3 scripts/public_docs.py check
          python3 tests/public-docs-rehearsal.py
      - name: Prepare the exact source export
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/public_docs.py export --ref HEAD --version "${RELEASE_TAG#v}" --output dist/public-docs
          else
            python3 scripts/public_docs.py export --ref HEAD --output dist/public-docs
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: aios-public-docs-${{ github.sha }}
          path: |
            dist/public-docs/aios.md
            dist/public-docs/aios.meta.json
          if-no-files-found: error
