name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag on main (for example v0.16.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aios-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and trusted workflow branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, re
          assert os.environ['WORKFLOW_REF'] == 'refs/heads/main', 'Run release preparation from main'
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['RELEASE_TAG']), 'Expected exact version tag'
          PY
  checks:
    needs: validate-request
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.tag }}
      release_tag: ${{ inputs.tag }}
  draft:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Download this run's validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name aios-release-package --dir dist/release
      - name: Create draft only, with verified checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          (cd dist/release && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json, os, subprocess
          entries = json.loads(subprocess.check_output([
            'gh', 'api', '--paginate', '--slurp',
            'repos/' + os.environ['GH_REPO'] + '/releases?per_page=100']))
          assert not any(r['tag_name'] == os.environ['RELEASE_TAG'] for page in entries for r in page), \
            'Release already exists; inspect it manually rather than replacing assets'
          PY
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag --draft \
            --title "AIOS ${RELEASE_TAG#v}" --generate-notes
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
