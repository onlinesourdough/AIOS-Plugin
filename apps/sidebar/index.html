<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIOS</title><style>/*APP_CSS*/</style></head>
<body>
<main>
  <header><strong>AIOS</strong><span>by onlinesourdough</span></header>
  <h1 id="heading" tabindex="-1">Get started</h1>
  <p id="intro" class="intro">Connect Notion and choose your context.</p>
  <p id="loading" role="status">Checking your setup…</p>
  <div id="content" hidden>
    <section id="notion" aria-labelledby="notion-title">
      <div class="step-title"><span class="step-number" aria-hidden="true">1</span><h2 id="notion-title">Connect Notion</h2><span id="connection-label" class="status" role="status"></span></div>
      <p id="connection-help" hidden></p>
      <div class="actions"><button id="connect" class="btn btn-secondary cursor-interaction" type="button" hidden>Connect Notion</button><button id="refresh" class="btn btn-ghost cursor-interaction" type="button" aria-label="Refresh Notion connection">Refresh status</button></div>
    </section>
    <form id="setup" hidden>
      <section id="context-form" aria-labelledby="context-title">
        <div class="step-title"><span id="context-number" class="step-number" aria-hidden="true">2</span><h2 id="context-title">Choose your context</h2></div>
        <label for="provider" class="form-label">Where does your context live?</label>
        <select id="provider" class="form-control"><option value="notion">Notion</option><option value="other">Another provider</option></select>
        <label id="target-label" for="target" class="form-label">Context link</label>
        <input id="target" class="form-control" type="text" maxlength="2048" autocomplete="off" required placeholder="https://notion.so/…" aria-describedby="scope">
        <p id="scope" class="hint">Your default context for new Codex chats.</p>
      </section>
      <button id="continue" class="btn btn-primary cursor-interaction" type="submit">Continue</button><button id="cancel" class="btn btn-ghost cursor-interaction" type="button" hidden>Cancel</button>
    </form>
    <section id="home" hidden aria-labelledby="home-title">
      <div class="step-title"><h2 id="home-title">Context</h2></div>
      <div class="context-row"><div><button id="open-context" class="context-link cursor-interaction" type="button">Open context ↗</button><span id="context-path" class="hint" hidden></span></div><button id="change" class="btn btn-ghost icon cursor-interaction" type="button" aria-label="Change context" title="Change context"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m12 4 4 4M4 12 13 3a2.8 2.8 0 0 1 4 4l-9 9-5 1 1-5Z"/></svg></button></div>
    </section>
  </div>
  <p id="feedback" role="status" aria-live="polite" hidden></p>
  <footer><span id="version"></span></footer>
</main>
<script type="module">/*APP_JS*/</script>
</body>
</html>
