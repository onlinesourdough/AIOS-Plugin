<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIOS</title><style>/*APP_CSS*/</style></head>
<body>
<main>
  <header class="page-header">
    <h1 id="heading" tabindex="-1">Get started</h1>
    <div class="header-actions">
      <span id="badge" class="badge" hidden>Connected</span>
      <button id="settings" class="btn btn-ghost icon cursor-interaction" type="button" aria-label="Settings" title="Settings" hidden><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m8 2-.5 2-2 1-2-.5-1.5 3 1.5 1.5v2L2 12.5l1.5 3 2-.5 2 1 .5 2h4l.5-2 2-1 2 .5 1.5-3-1.5-1.5v-2L18 7.5l-1.5-3-2 .5-2-1-.5-2Z"/><circle cx="10" cy="10" r="2.7"/></svg></button>
    </div>
  </header>
  <p id="loading" role="status">Checking your setup…</p>
  <button id="retry-load" class="btn btn-secondary cursor-interaction" type="button" hidden>Retry</button>

  <form id="setup" hidden novalidate>
    <p class="intro">Connect Notion, then choose your Context, Skills and Memory.</p>
    <div class="aios-card steps">
      <section class="step">
        <h2><button id="step-0" class="step-head cursor-interaction" type="button" aria-expanded="true" aria-controls="panel-0"><span class="step-number" aria-hidden="true">1</span><span class="step-label">Notion</span><span id="summary-0" class="summary"></span></button></h2>
        <div id="panel-0" class="step-panel" role="region" aria-labelledby="step-0">
          <div class="status-row"><span id="connection-label" class="status" role="status"></span><button id="refresh" class="btn btn-ghost icon cursor-interaction" type="button" aria-label="Refresh Notion connection" title="Refresh connection"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .3 5M16 3v4h-4"/></svg></button></div>
          <p id="connection-help" class="hint" hidden></p>
          <div class="step-actions"><button id="connect" class="btn btn-secondary cursor-interaction" type="button" hidden>Connect Notion</button><button id="continue-0" class="btn btn-primary cursor-interaction" type="submit">Continue</button></div>
        </div>
      </section>
      <section class="step">
        <h2><button id="step-1" class="step-head cursor-interaction" type="button" aria-expanded="false" aria-controls="panel-1"><span class="step-number" aria-hidden="true">2</span><span class="step-label">Context</span><span id="summary-1" class="summary"></span></button></h2>
        <div id="panel-1" class="step-panel" role="region" aria-labelledby="step-1" hidden>
          <div id="setup-context" hidden></div>
          <div class="field" id="context-link-field">
            <label id="target-label" for="target" class="field-label">Context link</label>
            <input id="target" class="form-control" type="text" maxlength="2048" autocomplete="off" placeholder="https://notion.so/…">
          </div>
          <button id="provider" class="btn btn-ghost link-toggle cursor-interaction" type="button">Use a folder or other link</button>
          <div id="setup-docs"></div>
          <p id="reason-1" class="hint" hidden></p>
          <div class="step-actions"><button id="continue-1" class="btn btn-primary cursor-interaction" type="submit">Continue</button></div>
        </div>
      </section>
      <section class="step">
        <h2><button id="step-2" class="step-head cursor-interaction" type="button" aria-expanded="false" aria-controls="panel-2"><span class="step-number" aria-hidden="true">3</span><span class="step-label">Skills</span><span id="summary-2" class="summary"></span></button></h2>
        <div id="panel-2" class="step-panel" role="region" aria-labelledby="step-2" hidden>
          <p id="reason-2" class="hint" hidden></p>
          <div id="setup-personalSkills"></div><div id="setup-teamSkills"></div>
          <div class="step-actions"><button id="continue-2" class="btn btn-primary cursor-interaction" type="submit">Continue</button></div>
        </div>
      </section>
      <section class="step">
        <h2><button id="step-3" class="step-head cursor-interaction" type="button" aria-expanded="false" aria-controls="panel-3"><span class="step-number" aria-hidden="true">4</span><span class="step-label">Memory</span><span id="summary-3" class="summary"></span></button></h2>
        <div id="panel-3" class="step-panel" role="region" aria-labelledby="step-3" hidden>
          <p id="reason-3" class="hint" hidden></p>
          <div id="setup-memory"></div><div id="setup-teamMemory"></div>
          <div class="step-actions"><button id="continue-3" class="btn btn-primary cursor-interaction" type="submit">Finish</button></div>
        </div>
      </section>
    </div>
  </form>

  <div id="dashboard" hidden>
    <div id="notice" class="notice" hidden><span id="notice-text"></span><button id="notice-connect" class="btn btn-ghost cursor-interaction" type="button" hidden>Connect</button></div>
    <div class="aios-card rows">
      <button id="open-context" class="row row-lead cursor-interaction" type="button"><span id="context-name" class="row-title"></span><span id="context-note" class="row-meta">Start here</span></button>
      <button id="open-docs" class="row cursor-interaction" type="button"><span id="docs-name" class="row-title">Docs</span><span id="docs-meta" class="row-meta"></span></button>
    </div>
    <section aria-labelledby="skills-title"><h2 id="skills-title">Skills</h2>
      <button id="open-personalSkills" class="row cursor-interaction" type="button"><span class="row-title">Personal</span><span id="personalSkills-meta" class="row-meta"></span></button>
      <button id="open-teamSkills" class="row cursor-interaction" type="button"><span class="row-title">Team</span><span id="teamSkills-meta" class="row-meta"></span></button>
    </section>
    <section aria-labelledby="memory-title"><h2 id="memory-title">Memory</h2>
      <button id="open-memory" class="row cursor-interaction" type="button"><span class="row-title">Personal</span><span id="memory-meta" class="row-meta"></span></button>
      <button id="open-teamMemory" class="row cursor-interaction" type="button"><span class="row-title">Team</span><span id="teamMemory-meta" class="row-meta"></span></button>
    </section>
  </div>

  <div id="feedback" class="feedback" hidden><span id="feedback-text" role="status" aria-live="polite"></span><button id="reload-draft" class="btn btn-ghost cursor-interaction" type="button" hidden>Load latest</button></div>
  <footer><span class="wordmark">onlinesourdough</span><span id="version"></span></footer>
</main>

<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title" tabindex="-1">Settings</h2><button id="drawer-close" class="btn btn-ghost icon cursor-interaction" type="button" aria-label="Close settings" title="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8"/></svg></button></div>
  <div class="drawer-body">
    <section><h3>Notion</h3>
      <div class="status-row"><span id="drawer-connection" class="status"></span><button id="drawer-refresh" class="btn btn-ghost icon cursor-interaction" type="button" aria-label="Refresh Notion connection" title="Refresh connection"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .3 5M16 3v4h-4"/></svg></button></div>
      <p id="drawer-help" class="hint" hidden></p>
      <button id="drawer-connect" class="btn btn-secondary cursor-interaction" type="button" hidden>Connect Notion</button>
    </section>
    <section><div id="settings-context"></div><div id="settings-docs"></div></section>
    <section><h3>Skills</h3><div id="settings-personalSkills"></div><div id="settings-teamSkills"></div></section>
    <section><h3>Memory</h3><div id="settings-memory"></div><div id="settings-teamMemory"></div></section>
    <div id="drawer-feedback" class="feedback" hidden><span id="drawer-feedback-text" role="status" aria-live="polite"></span><button id="drawer-reload" class="btn btn-ghost cursor-interaction" type="button" hidden>Load latest</button></div>
  </div>
  <div class="drawer-foot">
    <div id="foot-edit" class="foot-row"><button id="drawer-cancel" class="btn btn-ghost cursor-interaction" type="button">Cancel</button><button id="drawer-save" class="btn btn-primary cursor-interaction" type="button">Save</button></div>
    <div id="foot-discard" class="foot-row" hidden><span class="foot-question">Discard unsaved changes?</span><button id="keep-editing" class="btn btn-ghost cursor-interaction" type="button">Keep editing</button><button id="discard" class="btn btn-primary cursor-interaction" type="button">Discard</button></div>
  </div>
</dialog>
<script type="module">/*APP_JS*/</script>
</body>
</html>
